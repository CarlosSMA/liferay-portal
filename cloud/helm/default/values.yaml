- sites.email.membership.reply.subject="com/liferay/portlet/sites/dependencies/email_membership_reply_subject.tmpl"
- sites.email.membership.reply.body="com/liferay/portlet/sites/dependencies/email_membership_reply_body.tmpl"
- sites.email.membership.request.subject="com/liferay/portlet/sites/dependencies/email_membership_request_subject.tmpl"
- sites.email.membership.request.body="com/liferay/portlet/sites/dependencies/email_membership_request_body.tmpl"
- sites.sitemap.default.change.frequency="daily"
- sites.sitemap.default.priority=""
- trash.enabled="true"
- trash.search.limit="500"
- trash.entry.check.interval="60"
- trash.entries.max.age="43200"
- workflow.email.from.name=""
- workflow.email.from.address=""
- zip.file.writer.export.buffer.size="1048576000"
portalProperties:
ports:
    -   containerPort: 4000
        name: glowroot
        protocol: TCP
    -   containerPort: 7800
        name: cluster
        protocol: TCP
    -   containerPort: 8000
        name: debug
        protocol: TCP
    -   containerPort: 8080
        name: http
        protocol: TCP
pullSecrets: []
readinessProbe:
    failureThreshold: 2
    httpGet:
        path: /c/portal/robots
        port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
replicaCount: 1
resources: {}
schedulingGates: []
securityContext:
    capabilities:
        drop:
            -   ALL
    readOnlyRootFilesystem: true
service:
    annotations: {}
    ports:
        -   name: cluster
            port: 7800
            protocol: TCP
            targetPort: cluster
        -   name: http
            port: 8080
            protocol: TCP
            targetPort: http
    type: ClusterIP
serviceAccount:
    annotations: {}
    automount: true
    create: true
    name: ""
    role:
        annotations: {}
        rules:
            -   apiGroups:
                    -   ""
                resources:
                    -   configmaps
                verbs:
                    -   "*"
startupProbe:
    failureThreshold: 90
    httpGet:
        path: /c/portal/robots
        port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
tolerations: []
updateStrategy:
    type: RollingUpdate
volumeClaimTemplates:
    -   metadata:
            name: liferay-persistent-volume
        spec:
            accessModes:
                -   ReadWriteOnce
            resources:
                requests:
                    storage: 1Gi
volumeMounts:
    -   mountPath: /opt/liferay/data
        name: liferay-persistent-volume
        subPath: liferay/data
    -   mountPath: /opt/liferay/deploy
        name: liferay-persistent-volume
        subPath: liferay/deploy
    -   mountPath: /opt/liferay/glowroot
        name: liferay-persistent-volume
        subPath: liferay/glowroot
    -   mountPath: /opt/liferay/liferay.pid
        name: liferay-persistent-volume
        subPath: liferay/liferay.pid
    -   mountPath: /opt/liferay/logs
        name: liferay-persistent-volume
        subPath: liferay/logs
    -   mountPath: /opt/liferay/metrics
        name: liferay-persistent-volume
        subPath: liferay/metrics
    -   mountPath: /opt/liferay/osgi/client-extensions
        name: liferay-persistent-volume
        subPath: osgi/client-extensions
    -   mountPath: /opt/liferay/osgi/configs
        name: liferay-persistent-volume
        subPath: osgi/configs
    -   mountPath: /opt/liferay/osgi/configs/com.liferay.portal.k8s.agent.configuration.PortalK8sAgentConfiguration.config
        name: liferay-configmap
        subPath: com.liferay.portal.k8s.agent.configuration.PortalK8sAgentConfiguration.config
    -   mountPath: /opt/liferay/osgi/modules
        name: liferay-persistent-volume
        subPath: osgi/modules
    -   mountPath: /opt/liferay/osgi/state
        name: liferay-persistent-volume
        subPath: osgi/state
    -   mountPath: /opt/liferay/portal-cloud.properties
        name: liferay-configmap
        subPath: portal-cloud.properties
    -   mountPath: /opt/liferay/portal-ext.properties
        name: liferay-configmap
        subPath: portal-ext.properties
    -   mountPath: /opt/liferay/reports
        name: liferay-persistent-volume
        subPath: liferay/reports
    -   mountPath: /opt/liferay/routes
        name: liferay-persistent-volume
        subPath: liferay/routes
    -   mountPath: /opt/liferay/tomcat/conf/logging.properties
        name: liferay-persistent-volume
        subPath: tomcat/conf/logging.properties
    -   mountPath: /opt/liferay/tomcat/conf/server.xml
        name: liferay-persistent-volume
        subPath: tomcat/conf/server.xml
    -   mountPath: /opt/liferay/tomcat/logs
        name: liferay-persistent-volume
        subPath: tomcat/logs
    -   mountPath: /opt/liferay/tomcat/temp
        name: liferay-persistent-volume
        subPath: tomcat/temp
    -   mountPath: /opt/liferay/tomcat/work
        name: liferay-persistent-volume
        subPath: tomcat/work
    -   mountPath: /opt/liferay/unicast.xml
        name: liferay-configmap
        subPath: unicast.xml
    -   mountPath: /opt/liferay/work
        name: liferay-persistent-volume
        subPath: liferay/work
    -   mountPath: /tmp
        name: liferay-persistent-volume
        subPath: system/tmp
    -   mountPath: /usr/local/liferay/scripts/pre-configure/000_jdk_java_options.sh
        name: liferay-configmap
        subPath: 000_jdk_java_options.sh
    -   mountPath: /usr/local/liferay/scripts/pre-configure/010_install_prometheus_jmx_agent.sh
        name: liferay-configmap
        subPath: 010_install_prometheus_jmx_agent.sh
volumes:
    -   configMap:
            name: liferay-default
            optional: true
        name: liferay-configmap