suite: test deployment
templates:
  - templates/workloads.yaml
tests:
  - it: should have 2 replicas
    documentIndex: 0
    set:
      replicaCount: 2
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: liferay-default
      - equal:
          path: spec.replicas
          value: 2