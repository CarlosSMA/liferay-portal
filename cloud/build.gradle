import java.util.regex.Matcher

task updateFileVersions {
    description = 'Updates chart versions. If default is updated, aws is updated as a dependency.'

    doLast {
        if (!project.hasProperty('chart') || !project.hasProperty('type')) {
            throw new GradleException("Missing arguments. Usage: ./gradlew updateFileVersions -Pchart=default -Ptype=patch")
        }

        def chartName = project.property('chart')
        def updateType = project.property('type')

        def defaultPath = "helm/default/Chart.yaml"
        def awsPath = "helm/aws/Chart.yaml"

        if (chartName == 'default') {
            println "==> Processing 'default' update and cascading to 'aws'..."
            String newVersion = updateSingleChart(file(defaultPath), updateType)
            updateAwsDependencyAndVersion(file(awsPath), newVersion)
        } else {
            def targetFile = file("helm/${chartName}/Chart.yaml")
            if (!targetFile.exists()) throw new GradleException("Chart not found: ${targetFile.path}")
            updateSingleChart(targetFile, updateType)
        }
    }
}

def updateSingleChart(File chartFile, String updateType) {
    String content = chartFile.getText('UTF-8')
    // Matches the top-level version only (ignores versions inside 'dependencies:')
    Matcher matcher = (content =~ /(?m)^version:\s*(.*)/)
    
    if (!matcher.find()) throw new GradleException("Could not find top-level 'version:' in ${chartFile.path}")

    String oldVersion = matcher.group(1).trim()
    String newVersion = calculateNewVersion(oldVersion, updateType)

    String newContent = content.replaceAll(/(?m)^version:\s*.*/, "version: ${newVersion}")
    chartFile.write(newContent, 'UTF-8')
    
    println "==> [${chartFile.parentFile.name}] Main version updated: ${oldVersion} -> ${newVersion}"
    return newVersion
}

def updateAwsDependencyAndVersion(File awsFile, String newVersion) {
    if (!awsFile.exists()) return

    String content = awsFile.getText('UTF-8')
    
    // 1. Update the top-level version of the AWS chart itself
    String newContent = content.replaceAll(/(?m)^version:\s*.*/, "version: ${newVersion}")
    
    // 2. Update the dependency version for 'liferay-default'
    // This regex looks for 'name: liferay-default' and the VERY NEXT 'version:' line that follows it.
    newContent = newContent.replaceAll(/(?s)(name:\s*liferay-default.*?version:\s*)[^\n\r]*/) { _, prefix ->
        "${prefix}${newVersion}"
    }

    awsFile.write(newContent, 'UTF-8')
    println "==> [aws] Dependency 'liferay-default' synchronized to ${newVersion}"
}

def calculateNewVersion(String current, String type) {
    def baseVersion = current.split('-')[0]
    def parts = baseVersion.tokenize('.')
    if (parts.size() < 3) throw new GradleException("Invalid Version: ${current}")

    int major = parts[0].toInteger()
    int minor = parts[1].toInteger()
    int patch = parts[2].toInteger()

    switch (type.toLowerCase()) {
        case 'major': return "${major + 1}.0.0"
        case 'minor': return "${major}.${minor + 1}.0"
        case 'patch': return "${major}.${minor}.${patch + 1}"
        case 'alpha':
            def hash = "alpha"
            try { hash = "git rev-parse --short HEAD".execute().text.trim() ?: "alpha" } catch (e) {}
            return "${major}.${minor}.${patch}-${hash}"
        default:
            throw new GradleException("Unknown type: ${type}")
    }
}
